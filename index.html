<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Reset Zone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #181925 0%, #252836 100%);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(30, 32, 47, 0.95);
            border: 1px solid #3b3e54;
            border-radius: 24px;
            padding: 28px 22px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }
        .icon-badge {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: inline-block;
            background: #2a2d3f;
            padding: 12px;
            border-radius: 50%;
            border: 1px solid #454966;
        }
        h1 {
            font-size: 1.35rem;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 600;
        }
        p {
            font-size: 0.95rem;
            color: #a0aec0;
            line-height: 1.6;
            margin-bottom: 22px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: #2d3148;
            color: #93c5fd;
            border: 1px solid #434867;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:active {
            background: #3b405e;
            color: #ffffff;
            transform: scale(0.98);
        }
        .pass-btn {
            background: transparent;
            border: none;
            color: #718096;
            text-decoration: underline;
            font-size: 0.85rem;
            margin-top: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Looping Audio File -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="card" id="game-card">
        <div class="icon-badge" id="icon">🌿</div>
        <h1 id="title">The Safe Space & Reset Hub</h1>
        <p id="text">Zero awkwardness, zero overthinking, and no expectations. Pick whichever mode fits your current energy best right now:</p>
        
        <div id="options">
            <button class="btn" onclick="step(1)">🕊️ <b>Option 1: Complete Reset</b><br><span style="font-size:0.8rem; opacity:0.8;">Wipe the slate clean—no lingering bad vibes.</span></button>
            <button class="btn" onclick="step(2)">🧸 <b>Option 2: Pure Reassurance</b><br><span style="font-size:0.8rem; opacity:0.8;">A gentle reminder that I'm always in your corner.</span></button>
            <button class="btn" onclick="step(3)">🍕 <b>Option 3: Peace Offering</b><br><span style="font-size:0.8rem; opacity:0.8;">Skip all serious talks and jump straight to cozy routines.</span></button>
        </div>
        
        <button class="pass-btn" onclick="step(4)" id="pass">Just needing quiet time right now (Zero pressure)</button>
    </div>

    <script>
        function step(choice) {
            // Smoothly starts the looping audio on her first tap
            const music = document.getElementById('bg-music');
            if (music) {
                music.play().catch(() => {});
            }

            const icon = document.getElementById('icon');
            const title = document.getElementById('title');
            const text = document.getElementById('text');
            const options = document.getElementById('options');
            const pass = document.getElementById('pass');

            if (choice === 1) {
                icon.innerText = "✨";
                title.innerText = "Official Reset Activated";
                text.innerText = "Consider any recent stress officially cleared. Whatever was heavy or confusing is left behind. We start fresh right here with a completely clean slate.";
                options.innerHTML = `<button class="btn" onclick="location.reload()">↺ Explore other options</button>`;
                pass.style.display = "none";
            } else if (choice === 2) {
                icon.innerText = "🛡️";
                title.innerText = "Always In Your Corner";
                text.innerText = "No matter how quiet things get or how busy life feels, you never have to doubt where we stand. I'm always supporting you, fully patient, and right here whenever you want to talk.";
                options.innerHTML = `<button class="btn" onclick="location.reload()">↺ Explore other options</button>`;
                pass.style.display = "none";
            } else if (choice === 3) {
                icon.innerText = "☕";
                title.innerText = "Normalcy Restored";
                text.innerText = "No lengthy explanations needed. Let's just get back to our usual jokes, sharing random updates, and simple comfort.";
                options.innerHTML = `<button class="btn" onclick="location.reload()">↺ Explore other options</button>`;
                pass.style.display = "none";
            } else if (choice === 4) {
                icon.innerText = "🌙";
                title.innerText = "Rest Mode Honored";
                text.innerText = "Totally understood! Take all the space and time you need to recharge. Whenever you feel like reaching back out, I'll be right here.";
                options.innerHTML = `<button class="btn" onclick="location.reload()">↺ Back to menu</button>`;
                pass.style.display = "none";
            }
        }
    </script>

</body>
</html>
