<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Safe Zone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a24;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #252533;
            border-radius: 20px;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #38384d;
        }
        .emoji {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            font-size: 1rem;
            color: #b3b3cc;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: #33334d;
            color: #8be9fd;
            border: 1px solid #444466;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover, .btn:active {
            background: #444466;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .pass-btn {
            background: transparent;
            border: none;
            color: #777799;
            text-decoration: underline;
            font-size: 0.85rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="game-card">
        <div class="emoji" id="emoji">🌲</div>
        <h1 id="title">Welcome to the Safe Zone</h1>
        <p id="text">There are zero expectations here, no awkward conversations, and no rush. What sounds like the best prescription right now?</p>
        
        <div id="options">
            <button class="btn" onclick="step(1)">☕ A warm cup of quiet & no questions asked</button>
            <button class="btn" onclick="step(2)">🐱 A guaranteed distraction of funny memes</button>
            <button class="btn" onclick="step(3)">🛡️ Immunity pass: whatever happened is forgotten forever</button>
        </div>
        
        <button class="pass-btn" onclick="step(4)">I just want to rest (Pass option)</button>
    </div>

    <script>
        function step(choice) {
            const emoji = document.getElementById('emoji');
            const title = document.getElementById('title');
            const text = document.getElementById('text');
            const options = document.getElementById('options');

            if (choice === 1) {
                emoji.innerText = "☕";
                title.innerText = "Rest Mode Activated";
                text.innerText = "Option granted. Take all the quiet space you need. You don't have to explain anything or reply until you feel 100% ready.";
                options.innerHTML = `<button class="btn" onclick="location.reload()">↺ Start Over</button>`;
            } else if (choice === 2) {
                emoji.innerText = "✨";
                title.innerText = "Distraction Protocol";
                text.innerText = "Good choice! Whatever felt overwhelming earlier has zero power here. Sending funny memes and zero pressure your way.";
                options.innerHTML = `<button class="btn" onclick="location.reload()">↺ Start Over</button>`;
            } else if (choice === 3) {
                emoji.innerText = "📜";
                title.innerText = "Official Immunity Granted";
                text.innerText = "By clicking this, a permanent rule has been locked in: No judging, no awkwardness, and total reset. Everything is completely fine!";
                options.innerHTML = `<button class="btn" onclick="location.reload()">↺ Start Over</button>`;
            } else if (choice === 4) {
                emoji.innerText = "🌙";
                title.innerText = "Zero Pressure Pass";
                text.innerText = "Totally understandable. Rest up and recharge. You can come back whenever you like!";
                options.innerHTML = `<button class="btn" onclick="location.reload()">↺ Start Over</button>`;
            }
        }
    </script>

</body>
</html>
